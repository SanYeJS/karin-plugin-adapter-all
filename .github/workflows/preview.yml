name: Preview Publish # PR 自动发布预览包到 pkg.pr.new 并评论安装命令
# icqq 策略: CI 构建安装公开版 icqq@0.6.10 (安装依赖步骤临时改写 devDependencies),
# 本地开发使用 devDependencies 中的 npm:@icqqjs/icqq 高版本 (完整 NT 类型)
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push 到 main 时在 commit 下发预览包评论
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 安装依赖 (预览构建使用公开版 icqq 0.6.10, 本地开发才用 @icqqjs/icqq 高版本类型)
      - name: 安装依赖
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.devDependencies.icqq='^0.6.10';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          pnpm install --no-frozen-lockfile

      - name: 构建
        run: pnpm build

      # 发布预览包: 版本由 pkg.pr.new 按 commit 自动生成 (0.0.0-<sha>)
      # fork PR 无发布权限, 失败不阻塞且评论中提示
      - name: 发布预览包 (pkg.pr.new)
        id: publish
        continue-on-error: true
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          npx --yes pkg-pr-new publish --json output.json --comment=off --compact --packageManager=pnpm 2>&1 | tee pkg-output.txt
          URL=$(grep -oE 'https://pkg\.pr\.new/[^[:space:]`]+' pkg-output.txt | head -n 1 || echo "")
          if [ -n "$URL" ]; then
            if [[ "$URL" =~ https://pkg\.pr\.new/[^/]+/[^/]+/([^/]+@.+) ]]; then
              URL="https://pkg.pr.new/${BASH_REMATCH[1]}"
            fi
            echo "install_cmd=pnpm add ${URL} -w" >> "$GITHUB_OUTPUT"
          else
            echo "install_cmd=发布失败 (需安装 pkg.pr.new App: https://github.com/apps/pkg-pr-new), 请查看 Actions 日志" >> "$GITHUB_OUTPUT"
          fi

      # PR 自动评论: 同一 PR 重复推送时 upsert 覆盖同一条评论, 不刷屏
      - name: PR 评论
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## 📦 预览包已发布

            - **提交:** [`${{ steps.publish.outputs.short_sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **安装命令:**

            ```bash
            ${{ steps.publish.outputs.install_cmd }}
            ```
          comment-tag: preview-packages
          mode: upsert
          reactions: rocket

      # push 到 main / 手动触发: 无 PR 可评论, 改为在对应 commit 下评论 (含标记, 重复运行时覆盖更新)
      - name: Commit 评论
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '<!-- preview-packages -->'
            const body = [
              '## 📦 预览包已发布',
              '',
              `- **提交:** [\`${{ steps.publish.outputs.short_sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})`,
              '- **安装命令:**',
              '',
              '```bash',
              '${{ steps.publish.outputs.install_cmd }}',
              '```',
              '',
              tag,
            ].join('\n')
            const { data: comments } = await github.rest.repos.listCommentsForCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha,
            })
            const existing = comments.find(c => c.body.includes(tag))
            if (existing) {
              await github.rest.repos.updateCommitComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              })
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha, body,
              })
            }
