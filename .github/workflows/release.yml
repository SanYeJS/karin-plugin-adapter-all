name: Release and Publish # 发布和发布的工作流程名称
on:
  push:
    branches:
      - main # 仅当推送到 main 分支时触发
permissions:
  contents: write # 设置内容的权限为写
  pull-requests: write # 设置拉取请求的权限为写
  issues: write # 设置问题的权限为写
jobs:
  release-please:
    # 设置工作流程运行环境为 Ubuntu
    runs-on: ubuntu-latest
    # GitHub Packages 认证 token 先传到 job 级 env (secrets 不能在 if 条件中直接引用)
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      # 使用 release-please-action@v3
      - uses: google-github-actions/release-please-action@v3
        id: release
        with:
          # 设置发布类型为 Node.js
          release-type: node
      # 检出代码
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      # 安装 pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9 # 指定 pnpm 版本
        if: ${{ steps.release.outputs.release_created }}
      # 设置 Node.js 环境
      - uses: actions/setup-node@v4
        with:
          # 设置 Node.js 版本（tsdown 构建要求 >= 22.18）
          node-version: 22
          # 设置 npm 注册表 URL
          registry-url: https://registry.npmjs.org
        if: ${{ steps.release.outputs.release_created }}
      # 配置 GitHub Packages 认证（@icqqjs/icqq 发布在 GitHub Packages）
      - name: 配置 GitHub Packages 认证
        run: echo "//npm.pkg.github.com/:_authToken=${{ env.GH_PAT }}" >> .npmrc
        if: ${{ steps.release.outputs.release_created && env.GH_PAT != '' }}
      # 安装依赖
      - run: pnpm install --no-frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}
      # 编译
      - run: pnpm build
        if: ${{ steps.release.outputs.release_created }}
      # 构建完成后, 将构建内容写进 Release PR / Release 描述 (内容直接内联在本文件)
      - name: 写入构建成功内容
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          PR_BRANCH: release-please--branches--main--components--karin-plugin-adapter-all
        with:
          script: |
            const { owner, repo } = context.repo
            const content = '## 构建内容\n\n- 内置完整 Web 管理面板（`resources/web`，随 npm 包发布）\n- 多协议适配器：onebot11 / onebot12 / milky / kook / qqbot / icqq（icqq 为可选依赖）\n'
            if (process.env.RELEASE_TAG) {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: process.env.RELEASE_TAG })
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body: (release.body || '') + '\n' + content })
            } else {
              const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${process.env.PR_BRANCH}` })
              for (const pr of prs) {
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body: (pr.body || '') + '\n' + content })
              }
            }
        if: ${{ steps.release.outputs.release_created || steps.release.outputs.prs_created }}
      # 删除开发依赖
      - run: npm pkg delete devDependencies
        if: ${{ steps.release.outputs.release_created }}
      # 发布带npm
      - run: npm run pub
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs.release_created }}
  # 每次 main 推送时构建并同步产物到 build 分支
  sync-build:
    # 设置工作流程运行环境为 Ubuntu
    runs-on: ubuntu-latest
    # GitHub Packages 认证 token 先传到 job 级 env (secrets 不能在 if 条件中直接引用)
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      # 检出代码（保留完整历史）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 安装 pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9 # 指定 pnpm 版本
      # 设置 Node.js 环境（tsdown 构建要求 >= 22.18）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 配置 GitHub Packages 认证（@icqqjs/icqq 发布在 GitHub Packages）
      - name: 配置 GitHub Packages 认证
        run: echo "//npm.pkg.github.com/:_authToken=${{ env.GH_PAT }}" >> .npmrc
        if: ${{ env.GH_PAT != '' }}
      # 安装依赖
      - run: pnpm install --no-frozen-lockfile
      # 编译
      - run: pnpm build
      # 同步编译产物到 build 分支
      - name: Sync build artifacts to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build
          git add -A
          git add -f dist
          git commit -m "build: 同步编译产物" --allow-empty
          git push origin build --force