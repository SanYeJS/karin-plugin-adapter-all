name: Release and Publish # main 推送: release-please 管理版本 → 构建 → 发布 npm
on:
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # 版本管理与 Release PR 创建
      - uses: google-github-actions/release-please-action@v3
        id: release
        with:
          release-type: node
      # 检出代码
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      # 安装 pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9
        if: ${{ steps.release.outputs.release_created }}
      # 设置 Node.js 环境 (tsdown 构建要求 >= 22.18)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
        if: ${{ steps.release.outputs.release_created }}
      # 安装依赖 (发布构建使用公开版 icqq 0.6.10, 本地开发才用 @icqqjs/icqq 高版本类型)
      - name: 安装依赖
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.devDependencies.icqq='^0.6.10';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          pnpm install --no-frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}
      # 编译
      - run: pnpm build
        if: ${{ steps.release.outputs.release_created }}
      # 删除开发依赖
      - run: npm pkg delete devDependencies
        if: ${{ steps.release.outputs.release_created }}
      # 发布到 npm
      - run: npm run pub
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs.release_created }}
      # 发布成功后把 npm 包链接追加到 Release 描述
      - name: 更新 Release 描述
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        with:
          script: |
            const { owner, repo } = context.repo
            const section = `\n### 📦 npm 包\n- 版本：\`${process.env.RELEASE_TAG}\`\n- 安装命令：\`pnpm add karin-plugin-adapter-all -w\`\n- [查看 npm](https://www.npmjs.com/package/karin-plugin-adapter-all)\n`
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: process.env.RELEASE_TAG })
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body: (release.body || '') + section })
        if: ${{ steps.release.outputs.release_created }}
  # 发布摘要
  release-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release-please]
    if: always()
    steps:
      - name: 📊 生成发布摘要
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "## ✅ 发布流程完成"
            echo ""
            echo "- [npm 包](https://www.npmjs.com/package/karin-plugin-adapter-all)：\`karin-plugin-adapter-all\`"
            echo ""
            echo "### 🏷️ 发行版"
            if [ -n "$RELEASE_TAG" ]; then
              echo "- 本次发布版本：\`$RELEASE_TAG\`"
              echo "- [查看 Release](https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG)"
            else
              LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || echo "")
              if [ -n "$LATEST" ]; then
                echo "- 本次无新发布，最新 Release：\`$LATEST\`"
                echo "- [查看 Release](https://github.com/${{ github.repository }}/releases/tag/$LATEST)"
              else
                echo "- 暂未发布 Release"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
