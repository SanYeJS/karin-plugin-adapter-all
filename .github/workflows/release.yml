name: Release and Publish # 发布和发布的工作流程名称
on:
  push:
    branches:
      - main # 仅当推送到 main 分支时触发
permissions:
  contents: write # 设置内容的权限为写
  pull-requests: write # 设置拉取请求的权限为写
  issues: write # 设置问题的权限为写
jobs:
  release-please:
    # 设置工作流程运行环境为 Ubuntu
    runs-on: ubuntu-latest
    steps:
      # 使用 release-please-action@v3 动作
      - uses: google-github-actions/release-please-action@v3
        id: release
        with:
          # 设置发布类型为 Node.js
          release-type: node
      # 检出代码
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      # 安装 pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9 # 指定 pnpm 版本
        if: ${{ steps.release.outputs.release_created }}
      # 设置 Node.js 环境
      - uses: actions/setup-node@v4
        with:
          # 设置 Node.js 版本（tsdown 构建要求 >= 22.18）
          node-version: 22
          # 设置 npm 注册表 URL
          registry-url: https://registry.npmjs.org
        if: ${{ steps.release.outputs.release_created }}
      # 配置 GitHub Packages 认证（@icqqjs/icqq 发布在 GitHub Packages）
      - name: 配置 GitHub Packages 认证
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT }}" >> .npmrc
        if: ${{ steps.release.outputs.release_created && secrets.GH_PAT != '' }}
      # 安装依赖
      - run: pnpm install --no-frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}
      # 编译
      - run: pnpm build
        if: ${{ steps.release.outputs.release_created }}
      # 删除开发依赖
      - run: npm pkg delete devDependencies
        if: ${{ steps.release.outputs.release_created }}
      # 发布带npm
      - run: npm run pub
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs.release_created }}
  # 每次 main 推送时构建并同步产物到 build 分支
  sync-build:
    # 设置工作流程运行环境为 Ubuntu
    runs-on: ubuntu-latest
    steps:
      # 检出代码（保留完整历史）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 安装 pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9 # 指定 pnpm 版本
      # 设置 Node.js 环境（tsdown 构建要求 >= 22.18）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 配置 GitHub Packages 认证（@icqqjs/icqq 发布在 GitHub Packages）
      - name: 配置 GitHub Packages 认证
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PAT }}" >> .npmrc
        if: ${{ secrets.GH_PAT != '' }}
      # 安装依赖
      - run: pnpm install --no-frozen-lockfile
      # 编译
      - run: pnpm build
      # 同步编译产物到 build 分支
      - name: Sync build artifacts to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build
          git add -A
          git add -f dist
          git commit -m "build: 同步编译产物" --allow-empty
          git push origin build --force